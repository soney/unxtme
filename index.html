<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>UNXT.me</title>
		
		<meta name="description" content="Dead simple Unix timestamp conversion." />
		<meta name="keywords" content="epoch,unix,converter,timestamp,date,time,online,free,easy" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://netdna.bootstrapcdn.com/bootstrap/3.1.1/css/bootstrap.min.css">
		<link rel="stylesheet" type="text/css" href="style.css" />
		<link rel="icon" type="image/png" href="favico.png" />
	</head>
	<body>
		<div class="container">
			<div class="row">
				<div class="col-md-4 unix_time box">
					<div class='head'>
						<div class="explanation">unix&nbsp;time</div>
						<div class="input"><input aria-label="Unix timestamp" aria-describedby="unix_status" id="unix_time" type="text" autocomplete="off" /><p id="unix_status" role="status"></p></div>
						<div class="output" role="button" tabindex="0" title="Click to edit this converted value"></div>
					</div>
					<div class="options">
						<div class="format">
							timestamp units:
							<div><input type="radio" name="unix_format" value="seconds" id="seconds"/> <label for="seconds">seconds</label></div>
							<div><input type="radio" name="unix_format" value="milliseconds" id="milliseconds"/> <label for="milliseconds">milliseconds</label></div>
						</div>
					</div>
				</div>
				<div class="col-md-1 swap">
					<button type="button" id="swap" aria-label="Switch conversion direction">→</button>
				</div>
				<div class="col-md-7 human_time box">
					<div class='head'>
						<div class="explanation">human&nbsp;time</div>
						<div class="input">
							<input aria-label="Human date and time" aria-describedby="conversion_status" id="human_time" type="text" autocomplete="off" />
							<p id="conversion_status" role="status"></p>
						</div>
						<div class="output" role="button" tabindex="0" title="Click to edit this converted value"></div>
					</div>
					<div class="options">
						<div class='tz_form'>
							time zone:
							<div class="local"><input type="radio" name="time_zone" value="local" id="local"/> <label for="local">local</label></div>
							<div class="utc"><input type="radio" name="time_zone" value="utc" id="utc"/> <label for="utc">UTC</label></div>
							<div class="city">
								<span class="radio_label">
									<input type="radio" name="time_zone" value="city" id="city"/> <label for="city">city</label>
								</span>
								<input aria-label="Search city" aria-describedby="city_details" id="time_location" type="text" placeholder="e.g. Detroit" autocomplete="off"/>
								<div id="city_details" class="time_location_details" role="status"></div>
								<ul id="city_results" aria-label="Matching cities"></ul>
							</div>
						</div>
					</div>
				</div>
			</div>
			<footer>
				<div class="sitename"><a href="http://unxt.me">unxt.me</a></div>
				<div class="attribution">City search by <a href="https://open-meteo.com/">Open-Meteo</a> / <a href="https://www.geonames.org/">GeoNames</a></div>
				<div class="copyright"><a href="http://from.so/">Stephen Oney</a></div>
			</footer>
		</div>
	</body>
	<script src="vendor/moment.min.js"></script>
	<script src="vendor/moment-timezone-with-data.min.js"></script>
	<script src="vendor/chrono.min.js"></script>
	<script src="unxtme.js"></script>
</html>
